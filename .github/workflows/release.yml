name: Build and release

on:
  push:
    branches: ['**']
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - scripts/build.sh
      - scripts/download-ffmpeg.sh
      - docs/FFMPEG.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: build-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build binaries
        run: ./scripts/build.sh
      - name: Extract verified Windows FFmpeg executables
        run: ./scripts/download-ffmpeg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/patvs-linux-* \
            dist/patvs-windows-amd64.exe dist/patvs-windows-arm64.exe dist/SHA256SUMS \
            dist/ffmpeg.exe dist/ffmpeg-arm64.exe dist/FFMPEG-LICENSE.txt \
            --target "$GITHUB_SHA" \
            --title "patvs $VERSION" \
            --latest \
            --notes 'FFmpeg executables: unmodified LGPL builds from [BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds/releases/tag/autobuild-2026-09-30-13-08).' \
            --generate-notes
