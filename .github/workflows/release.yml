name: Build and release

on:
  push:
    branches: ['**']
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - scripts/build.sh
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: build-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: ./scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/patvs-linux-* dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "patvs $VERSION" \
            --latest \
            --generate-notes
